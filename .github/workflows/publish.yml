on:
  push: {branches: trunk}
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: 'trunk'
      - uses: actions/checkout@v4
        with:
          ref: 'publish'
          path: 'publish'
      - working-directory: publish
        run: |
          curl -L https://github.com/babashka/babashka/releases/download/v1.12.206/babashka-1.12.206-linux-amd64-static.tar.gz -o /tmp/bb.tar.gz
          tar xf /tmp/bb.tar.gz -C /tmp
          /tmp/bb ../trunk/onefeed.clj
          git commit -am "Onefeed"
          git push
